<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Access | BELTPRO</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --navy: #082f49;
    --blue: #0f4c81;
    --blue-2: #0369a1;
    --orange: #f97316;
    --ink: #172033;
    --muted: #5f6b7a;
    --line: #dbe4ee;
    --white: #ffffff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--navy), var(--blue));
    padding: 24px;
  }
  .card {
    width:100%; max-width:400px;
    background: var(--white);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
  }
  .card h1 { font-size:22px; color:var(--ink); margin-bottom:6px; }
  .card p.sub { color:var(--muted); font-size:14px; margin-bottom:24px; line-height:1.5; }
  label { display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .code-row { position:relative; margin-bottom:8px; }
  input[type="password"], input[type="text"] {
    width:100%; padding:13px 54px 13px 14px; border:2px solid var(--line);
    border-radius:10px; font-size:16px; color:var(--ink); outline:none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--blue-2); }
  .toggle-visibility {
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:12.5px; font-weight:700;
    color:var(--blue-2); padding:6px 8px;
  }
  .error-msg {
    display:none; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca;
    padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }
  .error-msg.show { display:block; }
  button.submit-btn {
    width:100%; padding:13px; border:none; border-radius:10px;
    background: var(--orange); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:8px; transition: filter .15s ease;
  }
  button.submit-btn:hover { filter:brightness(1.05); }
  .contact-note {
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--muted); line-height:1.6; text-align:center;
  }
  .contact-note a { color: var(--blue-2); font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <h1>Client Access</h1>
    <p class="sub">This calculator suite is available to BELTPRO clients. Enter your access code to continue.</p>

    <div class="error-msg" id="errorMsg">Invalid access code. Please double-check and try again.</div>

    <form id="accessForm" autocomplete="off">
      <label for="accessCode">Access code</label>
      <div class="code-row">
        <input type="password" id="accessCode" name="accessCode" placeholder="Enter code" autofocus required>
        <button type="button" class="toggle-visibility" id="toggleVisibility">Show</button>
      </div>
      <button type="submit" class="submit-btn">Unlock calculators →</button>
    </form>

    <div class="contact-note">
      Don't have a code yet? Contact BELTPRO at
      <a href="mailto:engenharia@beltpro.com.br">engenharia@beltpro.com.br</a>
      or
      <a href="https://wa.me/5514998005395">WhatsApp</a> to request access.
    </div>
  </div>

  <script src="/access-gate.js"></script>
  <script>
    (function () {
      var form = document.getElementById("accessForm");
      var input = document.getElementById("accessCode");
      var errorMsg = document.getElementById("errorMsg");
      var toggleBtn = document.getElementById("toggleVisibility");
      var submitBtn = form.querySelector(".submit-btn");

      function getReturnUrl() {
        var params = new URLSearchParams(window.location.search);
        var target = params.get("return");

        if (!target) return "/index.html";

        try {
          var resolved = new URL(target, window.location.href);
          if (resolved.origin === window.location.origin) {
            return resolved.href;
          }
        } catch (err) {
          /* fall through to default */
        }

        return "/index.html";
      }

      if (window.BeltproAccess && window.BeltproAccess.hasAccess()) {
        window.location.href = getReturnUrl();
        return;
      }

      toggleBtn.addEventListener("click", function () {
        var isPassword = input.getAttribute("type") === "password";
        input.setAttribute("type", isPassword ? "text" : "password");
        toggleBtn.textContent = isPassword ? "Hide" : "Show";
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!window.BeltproAccess) {
          errorMsg.textContent = "Access check unavailable right now. Please reload and try again.";
          errorMsg.classList.add("show");
          return;
        }

        var code = input.value.trim();
        submitBtn.disabled = true;
        submitBtn.textContent = "Checking…";
        errorMsg.classList.remove("show");

        window.BeltproAccess.verifyCode(code).then(function (valid) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Unlock calculators →";

          if (valid) {
            window.location.href = getReturnUrl();
          } else {
            errorMsg.textContent = "Invalid access code. Please double-check and try again.";
            errorMsg.classList.add("show");
            input.value = "";
            input.focus();
          }
        });
      });
    })();
  </script>
</body>
</html>
